name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlatPlanet.Platform.slnx

      - name: Build
        run: dotnet build FlatPlanet.Platform.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FlatPlanet.Platform.Tests --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish FlatPlanet.Platform.API --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: flatplanet-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      - name: Health check
        run: |
          echo "Waiting for app to warm up..."
          sleep 20
          curl --retry 6 --retry-delay 10 --retry-connrefused -f \
            https://flatplanet-api-freffxekdvb6hybs.southeastasia-01.azurewebsites.net/health \
            || (echo "Health check failed — deployment may be broken" && exit 1)
