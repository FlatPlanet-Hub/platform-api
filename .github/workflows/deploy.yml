name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlatPlanet.Platform.slnx

      - name: Build
        run: dotnet build FlatPlanet.Platform.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FlatPlanet.Platform.Tests --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish FlatPlanet.Platform.API --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: flatplanet-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      - name: Health check
        run: |
          echo "Waiting for app to warm up..."
          sleep 30
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://flatplanet-api-freffxekdvb6hybs.southeastasia-01.azurewebsites.net/health 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "App is running (HTTP $STATUS — 503 means DB health check failed, not app crash)"
              exit 0
            fi
            echo "Not ready yet (HTTP $STATUS), retrying in 15s..."
            sleep 15
          done
          echo "Health check failed — app is not responding after all retries"
          exit 1
