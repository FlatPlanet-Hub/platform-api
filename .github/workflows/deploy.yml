name: Build, Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlatPlanet.Platform.slnx

      - name: Build
        run: dotnet build FlatPlanet.Platform.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FlatPlanet.Platform.Tests --configuration Release --no-build --no-restore

      - name: Publish
        # --runtime linux-x64 is required by PublishReadyToRun (R2R needs a runtime identifier).
        # We drop --no-build because the prior `dotnet build` step did not target a RID,
        # so the linux-x64 artifacts R2R needs do not exist yet. Letting publish do its own
        # build for linux-x64 is the simplest reliable path.
        # --self-contained false keeps the deployed payload framework-dependent (smaller).
        run: dotnet publish FlatPlanet.Platform.API --configuration Release --runtime linux-x64 --self-contained false --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: flatplanet-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

